<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Dentovel shopping cart">
  <title>Your order — Dentovel</title>
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="stylesheet" href="https://use.typekit.net/pmn6ngx.css">
  <style>
    :root{--ink:#382f2c;--paper:#f3efec;--line:rgba(56,47,44,.17);--orange:#f37021;--display:"halyard-display-variable","Helvetica Neue",Arial,sans-serif;--text:"halyard-text-variable","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}html{background:var(--paper)}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:var(--text)}a{color:inherit;text-decoration:none}.topbar{height:88px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line)}.brand{grid-column:1;padding-left:clamp(24px,4vw,76px);font:600 clamp(18px,1.45vw,25px)/1 var(--display);letter-spacing:.1em;text-transform:uppercase}.nav{grid-column:2;display:flex;gap:clamp(20px,3vw,42px);font:500 12px var(--text);letter-spacing:.04em;text-transform:uppercase}.nav a{opacity:.7}.nav a:hover,.nav a[aria-current="page"]{opacity:1}.cart-order{width:min(1360px,calc(100% - 48px));margin:0 auto;padding:clamp(52px,7vw,112px) 0 82px}.cart-order h1{margin:0 0 clamp(34px,5vw,70px);font:400 clamp(42px,5.6vw,88px)/.92 var(--display);letter-spacing:-.06em}.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,.36fr);gap:clamp(38px,7vw,112px);align-items:start}.cart-lines{border-top:1px solid var(--line)}.cart-line{display:grid;grid-template-columns:116px minmax(0,1fr) auto;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.cart-line-image{display:grid;width:116px;height:116px;place-items:center;background:#e9e3df}.cart-line-image img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.cart-line h2{max-width:20ch;margin:0;font:400 clamp(20px,2vw,29px)/1 var(--display);letter-spacing:-.04em}.cart-line p{margin:7px 0 0;color:rgba(56,47,44,.63);font:13px/1.3 var(--text)}.cart-line-price{margin:12px 0 0;font:500 15px var(--text)}.cart-controls{display:flex;align-items:center;justify-content:flex-end;gap:18px}.quantity{display:flex;align-items:center;border:1px solid var(--line)}.quantity button,.remove-line{display:grid;width:34px;height:34px;place-items:center;border:0;background:transparent;color:inherit;font:20px/1 var(--text);cursor:pointer}.quantity span{display:grid;min-width:30px;place-items:center;font:13px var(--text)}.remove-line{width:auto;height:auto;color:rgba(56,47,44,.52);font-size:22px}.cart-summary{position:sticky;top:28px;padding-top:1px;border-top:1px solid var(--ink)}.summary-row{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);font:14px var(--text)}.summary-row.total{padding:22px 0;font:500 18px var(--text)}.checkout{display:flex;min-height:58px;align-items:center;justify-content:center;margin-top:22px;border:0;background:var(--ink);color:#fff;font:500 12px var(--text);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s ease}.checkout:hover{background:var(--orange);color:#25150c}.summary-note{margin:16px 0 0;color:rgba(56,47,44,.57);font:12px/1.45 var(--text)}.empty-cart{padding:30px 0 46px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.empty-cart p{max-width:32ch;margin:0;color:rgba(56,47,44,.62);font:16px/1.45 var(--text)}.empty-cart a{display:inline-flex;margin-top:28px;padding:14px 20px;background:var(--ink);color:#fff;font:500 12px var(--text);letter-spacing:.06em;text-transform:uppercase}.cart-footer{padding:28px 24px;border-top:1px solid var(--line);color:rgba(56,47,44,.58);font:12px var(--text);text-align:center}@media(max-width:760px){.topbar{height:60px}.topbar .brand,.topbar .nav{display:none}.cart-order{width:calc(100% - 40px);padding:96px 0 92px}.cart-order h1{margin-bottom:40px;font-size:45px}.cart-layout{grid-template-columns:1fr;gap:42px}.cart-line{grid-template-columns:78px minmax(0,1fr);gap:15px;padding:16px 0}.cart-line-image{width:78px;height:78px}.cart-line h2{font-size:21px}.cart-controls{grid-column:2;justify-content:space-between}.cart-summary{position:static}.checkout{min-height:56px}.cart-footer{padding-bottom:88px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Dentovel</a><nav class="nav" aria-label="Primary"><a href="index.html">Home</a><a href="catalog.html">Catalog</a><a href="bundles.html">Bundles</a><a href="contact.html">Contacts</a></nav></header>
  <main class="cart-order"><h1>Your order</h1><div id="cartContent" class="cart-layout" aria-live="polite"></div></main>
  <footer class="cart-footer">© 2026 Dentovel · Dental equipment &amp; accessories</footer>
  <script>
    (()=>{
      const catalog={
        'E220 Shade Matching Device':['$499','./denta-hero-assets/product-shade-glass-v1.png'],
        'Curing Light PREMIUM (Detection)':['$369','./denta-hero-assets/caries-silver-front-v2.png'],
        'Curing Light (1-Second)':['$229','./denta-hero-assets/product-fast-glass-v1.png'],
        'Cordless Endo Motor + Apex':['$399','./denta-hero-assets/product-endo-glass-v1.png'],
        'COXO C-SMART-I PILOT':['$799','./denta-hero-assets/product-c-smart-i-pilot-v1.png'],
        'Electric Implant Driver (16-pc)':['$299','./denta-hero-assets/product-driver-glass-v1.png'],
        'Implant Driver Kit':['$169','./denta-hero-assets/implant-driver-kit-gallery-full-v2.png'],
        'ProLight X LED Photo Lamp':['$219','./denta-hero-assets/prolight-x-v4-main.png'],
        'Torq Control Torque Wrench 5–35':['$129','./denta-hero-assets/torq-control-gallery-kit-v1.png']
      };
      const key='denta-cart',content=document.getElementById('cartContent');
      const money=value=>`$${value.toLocaleString('en-US')}`;
      const details=name=>catalog[name]||['$0','./denta-hero-assets/product-endo-glass-v1.png'];
      const read=()=>{try{const raw=JSON.parse(localStorage.getItem(key)||'[]');const merged=new Map();(Array.isArray(raw)?raw:[]).forEach(item=>{const name=typeof item==='string'?item:item.product;if(!name)return;const quantity=typeof item==='string'?1:Math.max(1,Number(item.quantity)||1);merged.set(name,(merged.get(name)||0)+quantity)});return [...merged].map(([name,quantity])=>({name,quantity}))}catch(_){return[]}};
      const write=items=>{const count=items.reduce((total,item)=>total+item.quantity,0);localStorage.setItem(key,JSON.stringify(items.map(item=>({product:item.name,quantity:item.quantity}))));localStorage.setItem('denta-cart-count',String(count));document.dispatchEvent(new CustomEvent('dentovel-cart-changed',{detail:{count}}))};
      const render=()=>{const items=read();if(!items.length){content.innerHTML='<section class="empty-cart"><p>Your order is empty. Discover professional tools for your clinical workflow.</p><a href="catalog.html">Explore catalog</a></section>';return}const total=items.reduce((sum,item)=>sum+Number(details(item.name)[0].replace('$',''))*item.quantity,0);content.innerHTML=`<section class="cart-lines">${items.map(item=>{const [price,image]=details(item.name);return `<article class="cart-line"><div class="cart-line-image"><img src="${image}" alt=""></div><div><h2>${item.name}</h2><p>Professional dental equipment</p><p class="cart-line-price">${price}</p></div><div class="cart-controls"><div class="quantity"><button type="button" data-change="-1" data-product="${item.name}" aria-label="Decrease quantity">−</button><span>${item.quantity}</span><button type="button" data-change="1" data-product="${item.name}" aria-label="Increase quantity">+</button></div><button type="button" class="remove-line" data-remove="${item.name}" aria-label="Remove ${item.name}">×</button></div></article>`}).join('')}</section><aside class="cart-summary"><div class="summary-row"><span>Items</span><span>${items.reduce((sum,item)=>sum+item.quantity,0)}</span></div><div class="summary-row"><span>Delivery</span><span>Calculated at checkout</span></div><div class="summary-row total"><span>Total</span><span>${money(total)}</span></div><button class="checkout" type="button">Proceed to checkout</button><p class="summary-note">Delivery options and final order details are confirmed at checkout.</p></aside>`;content.querySelectorAll('[data-change]').forEach(button=>button.addEventListener('click',()=>{const current=read();const item=current.find(entry=>entry.name===button.dataset.product);if(!item)return;item.quantity+=Number(button.dataset.change);write(current.filter(entry=>entry.quantity>0));render()}));content.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',()=>{write(read().filter(item=>item.name!==button.dataset.remove));render()}));content.querySelector('.checkout')?.addEventListener('click',()=>alert('Checkout will be available soon.'))};render();
    })();
  </script>
  <script src="site-navigation.js"></script>
</body>
</html>
